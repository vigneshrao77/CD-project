[project]
name = "cppjava"
version = "1.0.0"
description = "A hand-written, inspectable C++ subset to Java compiler"
requires-python = ">=3.11"

[project.scripts]
cppjava = "cppjava.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cppjava*"]
